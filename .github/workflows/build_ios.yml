name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main, novy_design ]

jobs:
  build:
    name: Build iOS
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release
        run: flutter build ios --release --no-codesign

      - name: Package into Unsigned IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r JavornikTimeRush-unsigned.ipa Payload
          cd ../../..

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: JavornikTimeRush-iOS-IPA
          path: build/ios/iphoneos/JavornikTimeRush-unsigned.ipa
